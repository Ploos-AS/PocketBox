name: MIPS cross-compile smoke
on:
  push:
  pull_request:

jobs:
  mango-mipsel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install generic MIPS little-endian cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mipsel-linux-gnu binutils-mipsel-linux-gnu
      - name: Compile PocketBox for MIPS little-endian Linux
        run: |
          make clean
          make CC=mipsel-linux-gnu-gcc
      - name: Verify architecture and record size
        run: |
          python3 openwrt/check_binary.py pocketbox --target mango
          mipsel-linux-gnu-readelf -h pocketbox
          mipsel-linux-gnu-size pocketbox
      - name: Preserve cross-compiled test artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocketbox-generic-mipsel-not-openwrt
          path: pocketbox
          retention-days: 7
