name: C11 host CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: make
      - name: Smoke tests
        run: make test\n      - name: AP/LAN profile tests\n        run: python3 -m unittest discover -s tests -p 'test_*.py'
